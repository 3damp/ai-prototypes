  }else if(t&&t.startsWith('order:')){
    dlgState={t:'order',id:+t.slice(6),mid:d.id};
  }else if(d.from==='slot'&&drop&&d.moved){
    state.sel[d.slot]=null;
  }else if(drop&&!d.moved){
    tapMoth(d.id,d.from);
  }
  render();
}
document.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  if(drag.src)return;
  const el=e.target.closest('[data-drag]');if(!el)return;
  if(e.target.closest('button,select,input,a'))return;
  const touch=e.pointerType!=='mouse';
  drag.src={id:+el.dataset.id,el,from:el.dataset.drag,slot:el.dataset.slot!=null?+el.dataset.slot:null,
    x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,touch,active:false,moved:false};
  if(touch)drag.src.timer=setTimeout(()=>{if(drag.src&&!drag.src.moved){startDrag();if(navigator.vibrate)navigator.vibrate(12)}},280);
  else e.preventDefault();
});
document.addEventListener('pointermove',e=>{
  const d=drag.src;if(!d)return;
  d.x=e.clientX;d.y=e.clientY;
  const dist=Math.hypot(d.x-d.sx,d.y-d.sy);
  if(!d.active){
    if(dist>8){d.moved=true;if(d.touch){clearTimeout(d.timer);drag.src=null}else startDrag()}
    return;
  }
  if(dist>8)d.moved=true;
  moveDrag(d.x,d.y);
});
document.addEventListener('pointerup',()=>endDrag(true));
document.addEventListener('pointercancel',()=>endDrag(false));
document.addEventListener('touchmove',e=>{if(drag.src&&drag.src.active)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('[data-drag]'))e.preventDefault()});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const oc=e.target.closest&&e.target.closest('.order[data-act="compare"]');
  if(oc&&e.target===oc){e.preventDefault();dlgState={t:'order',id:+oc.dataset.id};render();return}
  const el=e.target.closest&&e.target.closest('.card[data-drag]');if(!el)return;
  e.preventDefault();tapMoth(+el.dataset.id,'stable');render();
});

/* ---------- commissions popover: close on outside tap / Esc ---------- */
function placeOrders(){
  const po=document.getElementById('paneOrders'),nb=document.getElementById('navOrders');if(!po||!nb)return;
  const vw=window.innerWidth,w=Math.min(420,vw-20),r=nb.getBoundingClientRect(),cx=r.left+r.width/2;
  const left=Math.max(10,Math.min(vw-w-10,cx-w/2));
  po.style.left=left+'px';po.style.top=(r.bottom+12)+'px';po.style.setProperty('--ax',Math.max(22,Math.min(w-22,cx-left))+'px');
}
window.addEventListener('resize',placeOrders);
document.addEventListener('click',e=>{
  if(!state.ui.orders)return;
  if(e.target.closest&&e.target.closest('#paneOrders,#navOrders,dialog,#toast,#dev'))return;
  state.ui.orders=false;render();
},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&state.ui.orders&&!document.getElementById('dlg').open){state.ui.orders=false;render()}
});

/* ---------- secret testing panel ---------- */
const dev={open:false,tab:'genes',genes:null,srcId:null,tgtId:null};
const clone=g=>JSON.parse(JSON.stringify(g));
let rTimer=null;
const scheduleRender=()=>{clearTimeout(rTimer);rTimer=setTimeout(render,150)};
function devOpen(){
  dev.open=true;
  if(!dev.genes){const m=byId(state.sel[0])||state.moths[0];dev.srcId=m?m.id:null;dev.genes=m?clone(m.genes):wildGenes()}
  document.getElementById('dev').hidden=false;document.getElementById('devFont').value=state.ui.font||'journal';devBuild();
}
function devClose(){dev.open=false;document.getElementById('dev').hidden=true}
function devTarget(){return state.orders.find(o=>o.id===dev.tgtId)||state.orders[0]}
function pairBlock(){
  const o=devTarget();
  return `<div class="devpair"><figure><span class="stage" id="devStage"></span><figcaption>Test moth</figcaption></figure>
    <figure><span class="stage" id="devTgtStage"></span><figcaption>Commission picture</figcaption></figure></div>
    <div class="devcmp"><label>Compare with <select id="devTgt">${state.orders.map(x=>`<option value="${x.id}" ${o&&x.id===o.id?'selected':''}>${x.client}</option>`).join('')}</select></label>
    <div class="devscore" id="devScore"></div></div>`;
}
function devBuild(){
  document.getElementById('tabGenes').setAttribute('aria-selected',dev.tab==='genes');
  document.getElementById('tabSim').setAttribute('aria-selected',dev.tab==='sim');
  const box=document.getElementById('devBody'),T=state.tuning;
  document.getElementById('devPreview').innerHTML=pairBlock();
  if(dev.tab==='genes'){
    const src=byId(dev.srcId);
    box.innerHTML=`<label>Start from <select id="devSrc"><option value="">A random wild moth</option>${state.moths.map(m=>`<option value="${m.id}" ${m.id===dev.srcId?'selected':''}>${m.name} (gen ${m.gen})</option>`).join('')}</select></label>
      <p class="devdesc" id="devDesc" style="margin-top:8px"></p>
      <div class="dacts" style="margin-top:4px">
        <button class="btn small primary" data-act="devAdd">Add to stable</button>
        ${src?`<button class="btn small" data-act="devOverwrite">Overwrite ${src.name}</button>`:''}
        <button class="btn small" data-act="devSetTarget">Use as commission picture</button>
        <button class="btn small" data-act="devRandom">Randomize</button>
      </div>
      <p class="subnote" style="margin-top:12px">The top slider sets every copy of a trait's genes at once. Open a trait to adjust each copy separately.</p>
      ${TRAITS.map(t=>`<div class="trow"><div class="trh"><span>${t.label}</span><output id="dv_${t.k}"></output></div>
        <input type="range" min="0" max="1" step="0.01" data-dev="master" data-k="${t.k}" aria-label="${t.label}, all copies">
        <details><summary>${t.n} gene${t.n>1?'s':''}, ${t.n*2} copies</summary>
        ${dev.genes[t.k].map((pair,i)=>`<div class="arow"><span>Gene ${i+1}</span>${pair.map((v,j)=>`<input type="range" min="0" max="1" step="0.01" data-dev="al" data-k="${t.k}" data-i="${i}" data-j="${j}" aria-label="${t.label} gene ${i+1} copy ${j+1}">`).join('')}</div>`).join('')}
        </details></div>`).join('')}`;
  }else{
    box.innerHTML=`
      <p class="subnote" style="margin-top:8px">Traits are scored within four groups, then the groups are multiplied together. A poor score in an important group pulls the whole match down, however well everything else fits. Importance sets how hard each group pulls. Weights set how much each trait counts inside its group.</p>
      ${GROUPS.map(G=>`<div class="grp"><div class="grph"><span>${G.label}</span><span class="gs" id="gs_${G.g}"></span></div>
        <div class="wrow imp"><span>Importance</span><input type="range" min="0" max="5" step="0.1" value="${T.G[G.g]}" data-dev="gi" data-k="${G.g}" aria-label="${G.label} importance"><output id="gv_${G.g}">${T.G[G.g].toFixed(1)}</output><span></span></div>
        ${G.items.map(([k,label])=>`<div class="wrow"><span>${label}</span><input type="range" min="0" max="3" step="0.1" value="${T.W[k]}" data-dev="w" data-k="${k}" aria-label="${label} weight"><output id="wv_${k}">${T.W[k].toFixed(1)}</output><span class="sim" id="ws_${k}"></span></div>`).join('')}
      </div>`).join('')}
      <p class="sub">Scoring</p>
      <div class="trow"><div class="trh"><span>Color tolerance</span><output id="tv_colorTol"></output></div>
        <input type="range" min="0.05" max="0.5" step="0.01" value="${T.colorTol}" data-dev="colorTol" aria-label="Color tolerance">
        <p class="subnote">How different two colors can look before their match drops to zero. Lower is stricter.</p></div>
      <div class="trow"><div class="trh"><span>Sharpness</span><output id="tv_K"></output></div>
        <input type="range" min="1" max="5" step="0.1" value="${T.K}" data-dev="K" aria-label="Sharpness">
        <p class="subnote">How fast shape and marking traits stop matching as they differ. At 2, a trait that's half the scale off scores zero.</p></div>
      <div class="trow"><div class="trh"><span>Payment starts at</span><output id="tv_payMin"></output></div>
        <input type="range" min="0.2" max="0.9" step="0.01" value="${T.payMin}" data-dev="payMin" aria-label="Payment starts at"></div>
      <div class="trow"><div class="trh"><span>Full payment at</span><output id="tv_payFull"></output></div>
        <input type="range" min="0.3" max="1" step="0.01" value="${T.payFull}" data-dev="payFull" aria-label="Full payment at"></div>
      <div class="dacts"><button class="btn small" data-act="devResetTune">Reset to defaults</button></div>`;
  }
  devUpdate();
}
function devUpdate(){
  const p=phen(dev.genes),o=devTarget(),T=state.tuning;
  const st=document.getElementById('devStage');if(st)st.innerHTML=mothSVG(p,dev.srcId||7);
  const ts=document.getElementById('devTgtStage');if(ts)ts.innerHTML=o?mothSVG(o.target,o.id):'';
  const sc=document.getElementById('devScore');
  if(sc&&o){const s=match(p,o.target),pay=payout(o,s);sc.innerHTML=`<strong>${pc(s)}</strong> match, ${pay?`pays ${pay} of ${o.reward} coins`:'pays nothing'}`}
  const d=document.getElementById('devDesc');if(d)d.textContent=describe(p).map(([k,v])=>`${k}: ${v}`).join('. ')+'.';
  if(dev.tab==='genes'){
    for(const t of TRAITS){
      const out=document.getElementById('dv_'+t.k);if(!out)continue;
      out.textContent=p[t.k].toFixed(2)+(THR[t.k]!=null?(p[t.k]>THR[t.k]?', showing':`, shows above ${THR[t.k]}`):'');
      const m=document.querySelector(`[data-dev="master"][data-k="${t.k}"]`);if(m&&document.activeElement!==m)m.value=p[t.k];
      dev.genes[t.k].forEach((pair,i)=>pair.forEach((v,j)=>{const el=document.querySelector(`[data-dev="al"][data-k="${t.k}"][data-i="${i}"][data-j="${j}"]`);if(el&&document.activeElement!==el)el.value=v}));
    }
  }else{
    const groups=o?matchParts(p,o.target):[];
    for(const g of groups){
      const gs=document.getElementById('gs_'+g.g);if(gs)gs.textContent=g.I>0?pc(g.score):'not counted';
      for(const x of g.items){const el=document.getElementById('ws_'+x.k);if(el)el.textContent=x.w>0?pc(x.sim):'off'}
    }
    for(const k of ['K','colorTol','payMin','payFull']){const el=document.getElementById('tv_'+k);if(el)el.textContent=k==='K'?T.K.toFixed(1):k==='colorTol'?T.colorTol.toFixed(2):pc(T[k])}
  }
}
function devRefreshSelects(){
  const src=document.getElementById('devSrc');
  if(src&&document.activeElement!==src)src.innerHTML=`<option value="">A random wild moth</option>${state.moths.map(m=>`<option value="${m.id}" ${m.id===dev.srcId?'selected':''}>${m.name} (gen ${m.gen})</option>`).join('')}`;
  const tg=document.getElementById('devTgt'),o=devTarget();
  if(tg&&document.activeElement!==tg)tg.innerHTML=state.orders.map(x=>`<option value="${x.id}" ${o&&x.id===o.id?'selected':''}>${x.client}</option>`).join('');
  devUpdate();
}
document.addEventListener('input',e=>{
  const el=e.target,kind=el.dataset&&el.dataset.dev;if(!kind)return;
  const v=+el.value,k=el.dataset.k,T=state.tuning;
  if(kind==='master'){dev.genes[k]=dev.genes[k].map(()=>[v,v])}
  else if(kind==='al'){dev.genes[k][+el.dataset.i][+el.dataset.j]=v}
  else if(kind==='w'){T.W[k]=v;document.getElementById('wv_'+k).textContent=v.toFixed(1);scheduleRender()}
  else if(kind==='K'){T.K=v;scheduleRender()}
  else if(kind==='gi'){T.G[k]=v;document.getElementById('gv_'+k).textContent=v.toFixed(1);scheduleRender()}
  else if(kind==='colorTol'){T.colorTol=v;scheduleRender()}
  else if(kind==='payMin'){T.payMin=Math.min(v,T.payFull-.05);scheduleRender()}
  else if(kind==='payFull'){T.payFull=Math.max(v,T.payMin+.05);scheduleRender()}
  devUpdate();
});
document.addEventListener('change',e=>{
  if(e.target.id==='devFont'){state.ui.font=e.target.value;render();return}
  if(e.target.id==='devSrc'){const m=byId(+e.target.value);dev.srcId=m?m.id:null;dev.genes=m?clone(m.genes):wildGenes();devBuild()}
  if(e.target.id==='devTgt'){dev.tgtId=+e.target.value;devUpdate()}
  if(e.target.dataset&&e.target.dataset.dev)save();
});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const act=el.dataset.act;if(!act.startsWith('dev'))return;
  if(act==='devClose')return devClose();
  if(act==='devTab'){dev.tab=el.dataset.tab;return devBuild()}
  if(act==='devRandom'){dev.genes=wildGenes();dev.srcId=null;devBuild();return}
  if(act==='devAdd'){
    const m=newMoth(clone(dev.genes));if(!addMoth(m))return toast(t('allFull'));fresh.add(m.id);dev.srcId=m.id;toast(`${m.name} was added to your stable`);
  }
  if(act==='devOverwrite'){const m=byId(dev.srcId);if(m){m.genes=clone(dev.genes);toast(`${m.name}'s genes were rewritten`)}}
  if(act==='devSetTarget'){const o=devTarget();if(o){o.target=phen(dev.genes);toast(`${clientName(o)} now wants this moth`)}}
  if(act==='devResetTune'){state.tuning=defaultTuning();toast('Similarity settings reset')}
  if(act==='devCoins')state.coins+=100;
  if(act==='devOrders'){state.orders=[0,1,2].map(newOrder);dev.tgtId=null}
  if(act==='devGarden'){if(state.ui.panel!=='garden'){state.ui.panel='garden';render()}setTimeout(spawnVisitor,50)}
  render();devBuild();
});
document.addEventListener('keydown',e=>{
  if(e.key!=='`'&&e.key!=='~')return;
  const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'&&e.target.type==='text')return;
  e.preventDefault();dev.open?devClose():devOpen();
});
let taps=[];
document.getElementById('coinStat').addEventListener('click',()=>{
  const now=Date.now();taps=taps.filter(t=>now-t<2000);taps.push(now);
  if(taps.length>=5){taps=[];dev.open?devClose():devOpen()}
});

state=load();if(!state)newGame();
if(!state.tuning||state.tuning.v!==3)state.tuning=defaultTuning();
if(!state.ui)state.ui={dock:true};
state.ui.relSel=state.ui.relSel||[];
if(!Array.isArray(state.boxes)||!state.boxes.length)state.boxes=[{id:state.nextId++,name:''}];
state.moths.forEach(m=>{if(!state.boxes.some(b=>b.id===m.box))m.box=state.boxes[0].id});
if(!state.boxes.some(b=>b.id===state.ui.box))state.ui.box=state.boxes[0].id;
if(!state.ui.lang){let l=null;try{l=localStorage.getItem('mothnight-lang')}catch(e){}state.ui.lang=l||((navigator.language||'').toLowerCase().startsWith('es')?'es':'en')}
if(state.ui.panel===undefined||state.ui.panel==='orders')state.ui.panel='';
state.ui.orders=false;
state.sel=[0,1].map(i=>state.sel&&byId(state.sel[i])?state.sel[i]:null);
render();
</script>
