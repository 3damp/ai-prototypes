<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Prototypes</title>
<style>
:root {
  --background: #f7f6f3;
  --surface: #ffffff;
  --text: #1d1c1a;
  --text-muted: #6b6862;
  --border: #e3e0da;
  --accent: #8a5a1c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: #161514;
    --surface: #201f1d;
    --text: #ece9e4;
    --text-muted: #a19d96;
    --border: #34322f;
    --accent: #e0a85a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--background);
  color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
main {
  max-width: 720px;
  margin: 0 auto;
  padding: 48px 16px;
}
h1 { margin: 0 0 4px; font-size: 1.75rem; }
.intro { margin: 0 0 32px; color: var(--text-muted); }
.prototype-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 12px;
}
.prototype-link {
  display: block;
  padding: 16px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: inherit;
  text-decoration: none;
}
.prototype-link:hover, .prototype-link:focus-visible { border-color: var(--accent); }
.prototype-name { font-weight: 600; color: var(--accent); }
.prototype-summary { display: block; color: var(--text-muted); font-size: 0.95rem; }
</style>
</head>
<body>
<main>
  <h1>AI Prototypes</h1>
  <p class="intro">Small experiments built with AI. Each one runs in the browser.</p>
  <ul class="prototype-list">
    <li>
      <a class="prototype-link" href="moth-breeding-game/">
        <span class="prototype-name">Moth Night</span>
        <span class="prototype-summary">Breed moths for wing traits and fill collectors' orders.</span>
      </a>
    </li>
    <li>
      <a class="prototype-link" href="paint-mixer/">
        <span class="prototype-name">Paint Mixer</span>
        <span class="prototype-summary">Drag paint into dishes and mix colours like real pigment.</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
